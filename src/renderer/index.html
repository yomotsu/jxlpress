<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'">
	<title>JXLPress</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="app">

		<main class="files">
			<div class="toolbar">
				<button id="add" type="button">画像を追加</button>
				<span class="spacer"></span>
				<button id="clear-done" type="button" class="ghost">完了済みを削除</button>
				<button id="clear-all" type="button" class="ghost">すべて消去</button>
			</div>

			<div id="drop-zone" class="drop-zone">
				<div id="empty" class="empty">
					<p class="empty-title">画像かフォルダをここにドロップ</p>
					<p class="empty-sub">PNG / JPEG / GIF / WebP / AVIF / HEIC / PPM など。</p>
				</div>
				<table id="file-table" class="file-table" hidden>
					<thead>
						<tr>
							<th class="col-select"><input class="select-all" type="checkbox" aria-label="全件を選択"></th>
							<th class="col-name">ファイル</th>
							<th class="col-num">元サイズ</th>
							<th class="col-num">JXL</th>
							<th class="col-num">比率</th>
							<th class="col-status">状態</th>
							<th class="col-actions"></th>
						</tr>
					</thead>
					<tbody id="file-rows"></tbody>
				</table>
			</div>

			<div id="cjxl-error" class="engine-error" role="alert" hidden>変換エンジン（cjxl）が見つかりません。アプリを再インストールしてください。</div>
			<div class="footer">
				<div class="summary" id="summary"></div>
				<div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
				<button id="cancel" type="button" class="ghost" hidden>中止</button>
				<button id="convert" type="button" class="primary">変換</button>
			</div>

			<section id="preview-modal" class="preview-modal" aria-label="プレビュー" hidden>
				<div class="preview-panel">
					<header class="preview-header">
						<div class="preview-heading">
							<strong id="preview-title"></strong>
							<span id="preview-meta" class="hint"></span>
							<span id="preview-settings" class="hint"></span>
						</div>
						<div class="preview-controls">
							<div class="preview-zoom">
								<button id="preview-zoom-out" type="button" class="small" aria-label="縮小">−</button>
								<span id="preview-zoom-value" class="preview-zoom-value">100%</span>
								<button id="preview-zoom-in" type="button" class="small" aria-label="拡大">+</button>
								<button id="preview-fit" type="button" class="small">全体</button>
								<button id="preview-100" type="button" class="small">100%</button>
							</div>
							<button id="preview-close" type="button" class="small">閉じる</button>
						</div>
					</header>
					<div id="preview-stage" class="preview-stage">
						<div id="preview-loading" class="preview-loading" hidden>生成中…</div>
						<div id="preview-compare" class="preview-compare" hidden>
							<img id="preview-jxl" alt="JXL デコード結果">
							<div id="preview-original-clip" class="preview-original-clip">
								<img id="preview-original" alt="元画像">
							</div>
						</div>
						<div id="preview-divider" class="preview-divider" role="slider" aria-label="比較位置" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0" hidden>
							<span></span>
						</div>
					</div>
					<div class="preview-legend"><span>左: 元画像</span><span>右: JXL</span></div>
				</div>
			</section>
		</main>

		<aside class="settings">

			<section>
				<h2>画質</h2>

				<div class="field" id="distance-field">
					<div class="field-head">
						<label for="distance">Distance</label>
						<input type="number" min="0" max="10" step="1" data-option="distance" data-pair="distance-range">
					</div>
					<input id="distance" type="range" min="0" max="10" step="1" data-option="distance" data-pair="distance-range">
					<p class="hint">小さいほど高画質。0 = ロスレス、1 = 視覚的ロスレス。推奨 1〜3。</p>
				</div>

				<label class="check"><input id="lossless" type="checkbox"> ロスレス（Distance 0）</label>

				<div class="field">
					<div class="field-head">
						<label for="effort">Effort</label>
						<span><input type="number" min="1" max="10" step="1" data-option="effort"> <span id="effort-name" class="badge"></span></span>
					</div>
					<input id="effort" type="range" min="1" max="10" step="1" data-option="effort">
					<p class="hint">大きいほど遅いが高効率。既定 7。</p>
				</div>
				<p id="jpeg-notice" class="hint" hidden></p>
			</section>

			<details>
				<summary>詳細オプション</summary>

				<div class="grid">
					<label>Alpha distance
						<input type="number" min="0" max="25" step="0.05" placeholder="0（既定）" data-option="alphaDistance" data-nullable>
					</label>

					<label>Modular
						<select data-option="modular">
							<option value="auto">自動</option>
							<option value="0">VarDCT 強制</option>
							<option value="1">Modular 強制</option>
						</select>
					</label>

					<label>EPF（エッジ保存フィルタ）
						<select data-option="epf">
							<option value="-1">自動</option>
							<option value="0">0（オフ）</option>
							<option value="1">1</option>
							<option value="2">2</option>
							<option value="3">3</option>
						</select>
					</label>

					<label>Gaborish
						<select data-option="gaborish">
							<option value="auto">自動</option>
							<option value="0">オフ</option>
							<option value="1">オン</option>
						</select>
					</label>

					<label>Photon noise ISO
						<input type="number" min="0" max="51200" step="100" data-option="photonNoiseIso">
					</label>

					<label>Faster decoding
						<select data-option="fasterDecoding">
							<option value="0">0（既定）</option>
							<option value="1">1</option>
							<option value="2">2</option>
							<option value="3">3</option>
							<option value="4">4</option>
						</select>
					</label>

					<label>Resampling
						<select data-option="resampling">
							<option value="-1">自動</option>
							<option value="1">1x1</option>
							<option value="2">2x2</option>
							<option value="4">4x4</option>
							<option value="8">8x8</option>
						</select>
					</label>

					<label>Keep invisible
						<select data-option="keepInvisible">
							<option value="auto">自動</option>
							<option value="0">オフ</option>
							<option value="1">オン</option>
						</select>
					</label>

					<label>Brotli effort
						<input type="number" min="0" max="11" step="1" data-option="brotliEffort">
					</label>

					<label>スレッド数
						<input type="number" min="-1" max="256" step="1" data-option="numThreads">
					</label>
				</div>

				<label class="check"><input type="checkbox" data-option="progressive"> プログレッシブ</label>
				<label class="check"><input type="checkbox" data-option="container"> コンテナ形式を強制</label>

				<h3>メタデータ</h3>
				<div class="inline-checks">
					<label class="check"><input type="checkbox" data-option="stripExif" data-invert> EXIF を引き継ぐ</label>
					<label class="check"><input type="checkbox" data-option="stripXmp"> XMP を削除</label>
					<label class="check"><input type="checkbox" data-option="stripJumbf"> JUMBF を削除</label>
				</div>
				<p class="hint">AVIF / BMP / ICO の入力は EXIF を引き継げません。</p>

				<label class="block">追加の cjxl 引数
					<input type="text" placeholder="例: --codestream_level=10 -x color_space=sRGB" data-option="extraArgs" spellcheck="false">
				</label>
			</details>

			<section>
				<h2>出力</h2>

				<div class="segmented" role="radiogroup">
					<label><input type="radio" name="output-mode" value="same" data-setting="outputMode"> 元と同じ場所</label>
					<label><input type="radio" name="output-mode" value="folder" data-setting="outputMode"> 指定フォルダ</label>
				</div>

				<div class="path-row" id="output-dir-row">
					<span id="output-dir" class="path">未選択</span>
					<button id="choose-output" type="button" class="small">選択</button>
				</div>

				<label class="block">同名ファイルがある場合
					<select data-setting="conflict">
						<option value="rename">別名で保存（-1, -2…）</option>
						<option value="overwrite">上書き</option>
						<option value="skip">スキップ</option>
					</select>
				</label>

			</section>

			<button id="reset-options" type="button" class="ghost wide">設定を初期値に戻す</button>
			<div class="app-info-row">
				<span id="app-version" class="hint"></span>
				<button id="update-link" type="button" class="link" hidden></button>
			</div>
		</aside>

	</div>

	<template id="row-template">
		<tr>
			<td class="col-select"><input class="select" type="checkbox" aria-label="この項目を選択"></td>
			<td class="col-name">
				<div class="file-cell">
					<div class="thumbnail" aria-hidden="true">
						<span class="thumbnail-placeholder"></span>
						<img class="thumbnail-image" alt="" draggable="false" hidden>
					</div>
					<div class="file-label"><span class="name"></span><span class="dir"></span></div>
				</div>
			</td>
			<td class="col-num in-size"></td>
			<td class="col-num out-size"></td>
			<td class="col-num ratio"></td>
			<td class="col-status"><span class="status"></span></td>
			<td class="col-actions">
				<button type="button" class="small preview">プレビュー</button>
				<button type="button" class="icon reveal" title="フォルダで表示" hidden>↗</button>
				<button type="button" class="icon remove" title="リストから削除">×</button>
			</td>
		</tr>
	</template>

	<script type="module" src="renderer.js"></script>
</body>
</html>
